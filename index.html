<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WTC7 Investigation — Dr. Hulsey Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --ink:#12181f;
    --steel-900:#1b2733;
    --steel-800:#243342;
    --steel-700:#33475b;
    --steel-500:#5c7488;
    --steel-200:#c9d4dd;
    --steel-100:#e7edf1;
    --paper:#f6f4ee;
    --amber:#c17a2c;
    --amber-dim:#e3ba86;
    --rule: rgba(18,24,31,0.12);
    box-sizing:border-box;
  }
  *{box-sizing:inherit;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  header.masthead{
    padding:1.75rem clamp(1.25rem,4vw,3rem) 1.4rem;
    border-bottom:1px solid var(--rule);
    background:var(--paper);
  }
  header.masthead .eyebrow{
    font-size:0.78rem;
    color:var(--steel-500);
    letter-spacing:0.02em;
    margin:0 0 0.4rem;
  }
  header.masthead h1{
    font-family:'Source Serif 4', Georgia, serif;
    font-weight:700;
    font-size:clamp(1.5rem, 2.4vw, 2.15rem);
    margin:0 0 0.35rem;
    color:var(--steel-900);
    line-height:1.15;
  }
  header.masthead p.dek{
    margin:0;
    max-width:66ch;
    color:var(--steel-700);
    font-size:0.96rem;
    line-height:1.5;
  }

  .layout{
    display:grid;
    grid-template-columns: 320px 1fr;
    gap:0;
    min-height:calc(100vh - 120px);
  }

  nav.subtitles{
    border-right:1px solid var(--rule);
    padding:0.75rem 0 2rem;
    background:var(--paper);
    overflow-y:auto;
    max-height:calc(100vh - 120px);
  }

  .section-group{
    border-bottom:1px solid var(--rule);
  }
  .section-toggle{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:0.75rem;
    width:100%;
    background:none;
    border:none;
    cursor:pointer;
    text-align:left;
    padding:0.9rem 1.5rem;
    font-family:'Source Serif 4', Georgia, serif;
    font-weight:600;
    font-size:0.98rem;
    color:var(--steel-900);
  }
  .section-toggle .chevron{
    font-family:'Inter',sans-serif;
    font-size:0.75rem;
    color:var(--steel-500);
    transition:transform 0.15s ease;
    flex:0 0 auto;
  }
  .section-group.collapsed .chevron{
    transform:rotate(-90deg);
  }
  .section-toggle:hover{
    background:var(--steel-100);
  }
  .section-toggle:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:-2px;
  }

  .section-body{
    padding-bottom:0.5rem;
  }
  .section-group.collapsed .section-body{
    display:none;
  }

  .subtitle-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .subtitle-item{
    border-left:3px solid transparent;
  }
  .subtitle-btn{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    cursor:pointer;
    padding:0.55rem 1.35rem 0.55rem 1.5rem;
    font-family:inherit;
    color:var(--steel-700);
    font-size:0.92rem;
    line-height:1.4;
    transition:background-color 0.15s ease, color 0.15s ease;
  }
  .subtitle-btn:hover{
    background:var(--steel-100);
    color:var(--steel-900);
  }
  .subtitle-item.active{
    border-left-color:var(--amber);
    background:var(--steel-100);
  }
  .subtitle-item.active .subtitle-btn{
    color:var(--steel-900);
    font-weight:600;
  }
  .subtitle-btn:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:-2px;
  }
  .clip-count{
    color:var(--steel-500);
    font-size:0.78rem;
    font-weight:400;
  }

  main.stage{
    padding:clamp(1.25rem,3vw,2.5rem);
    display:flex;
    flex-direction:column;
    gap:1.5rem;
    max-width:920px;
    flex:1 1 auto;
  }

  .breadcrumb{
    font-size:0.82rem;
    color:var(--steel-500);
    margin:0;
  }
  h2#subtitleHeading{
    font-family:'Source Serif 4', Georgia, serif;
    font-size:1.5rem;
    font-weight:700;
    margin:0.2rem 0 0;
    color:var(--steel-900);
    line-height:1.2;
  }

  .clip{
    display:flex;
    flex-direction:column;
    gap:0.75rem;
    padding-top:1.25rem;
    border-top:1px solid var(--rule);
  }
  .clip:first-of-type{
    border-top:none;
    padding-top:0;
  }
  .clip-index{
    font-size:0.78rem;
    color:var(--steel-500);
    margin:0;
  }

  .video-frame{
    position:relative;
    background:var(--steel-900);
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(18,24,31,0.18);
    aspect-ratio:16/9;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .video-frame iframe{
    display:block;
    width:100%;
    height:100%;
    border:none;
  }
  .video-frame img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
  }
  .video-frame.unavailable{
    background:var(--steel-800);
  }
  .video-placeholder{
    text-align:center;
    color:var(--steel-200);
    padding:1.5rem;
    max-width:36ch;
  }
  .video-placeholder .icon{
    font-size:1.6rem;
    display:block;
    margin-bottom:0.5rem;
    opacity:0.7;
  }
  .video-placeholder p{
    margin:0;
    font-size:0.88rem;
    line-height:1.5;
  }
  .video-placeholder .fname{
    display:block;
    margin-top:0.5rem;
    font-size:0.76rem;
    color:var(--steel-500);
    word-break:break-word;
  }
  .video-caption{
    font-size:0.8rem;
    color:var(--steel-500);
    word-break:break-word;
    margin:0.4rem 0 0;
  }

  .commentary{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:4px;
    padding:1.4rem 1.6rem;
  }
  .commentary h3{
    font-size:0.78rem;
    font-weight:600;
    margin:0 0 0.75rem;
    color:var(--steel-500);
  }
  .commentary-text{
    margin:0;
    color:var(--ink);
    font-size:1.02rem;
    line-height:1.7;
    max-width:68ch;
  }
  .commentary-text p{
    margin:0 0 0.85em;
  }
  .commentary-text p:last-child{
    margin-bottom:0;
  }

  @media (max-width: 760px){
    .layout{
      grid-template-columns: 1fr;
    }
    nav.subtitles{
      border-right:none;
      border-bottom:1px solid var(--rule);
      max-height:40vh;
    }
    main.stage{
      max-width:none;
    }
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e9edf1;
      --paper:#161c22;
      --steel-900:#eef2f5;
      --steel-800:#dbe3e9;
      --steel-700:#aebccb;
      --steel-500:#8496a6;
      --steel-200:#33475b;
      --steel-100:#1f2932;
      --rule: rgba(233,237,241,0.14);
    }
    :root:not([data-theme="light"]) .commentary{
      background:#1c242d;
    }
  }
  :root[data-theme="dark"]{
    --ink:#e9edf1;
    --paper:#161c22;
    --steel-900:#eef2f5;
    --steel-800:#dbe3e9;
    --steel-700:#aebccb;
    --steel-500:#8496a6;
    --steel-200:#33475b;
    --steel-100:#1f2932;
    --rule: rgba(233,237,241,0.14);
  }
  :root[data-theme="dark"] .commentary{
    background:#1c242d;
  }
</style>

ional expansion.", "youtube_link": "https://youtu.be/Jc-OsjxemNA", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/Jc-OsjxemNA"}, {"title": "5. Inconsistencies in \"official\" report", "subtitle": "5.7. NIST Omitted Web Stiffeners", "commentary": "- Web stiffners strengthens the girder flanges tremendously (79 times).\n- Without web stiffners the girder flanges would begin to flex before the girder is completely pushed off its seat.\n- The presense of web stiffeners delays flange failure significantly.", "youtube_link": "https://youtu.be/B1376fs_ghY", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/B1376fs_ghY"}, {"title": "5. Inconsistencies in \"official\" report", "subtitle": "5.8. NIST Omitted Column Side Plate", "commentary": "- Columns were constructed with side plates that would prevent adjoining girder from moving east to west as NIST claims.", "youtube_link": "https://youtu.be/yry4xzdURys", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/yry4xzdURys"}, {"title": "5. Inconsistencies in \"official\" report", "subtitle": "5.8. NIST Omitted Column Side Plate", "commentary": "- This explains why the girder could not have been pushed off its bearing seat due to the presense of the column side plates.  \n- NIST omitted the side plates from their model.", "youtube_link": "https://youtu.be/876vJ8edbHE", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/876vJ8edbHE"}, {"title": "5. Inconsistencies in \"official\" report", "subtitle": "5.9. Duration of Fires in WTC7", "commentary": "-  Fires in WTC7 burned less hot and consumed fuel quickly contrary to NIST's claims.\n- NIST model (top) shows fires burning at column 79 at 4pm.\n- Video evidence shows that the fires were largely extinguished near column 79 by 3:50pm.", "youtube_link": "https://youtu.be/NxUZuomK6G8", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/NxUZuomK6G8"}, {"title": "5. Inconsistencies in \"official\" report", "subtitle": "5.9. Duration of Fires in WTC7", "commentary": "- Fires burned for 20 mins in any given place. Max temp 200-degrees C.  \n- \"…such temperatures would have no effect on the construction steel.\"", "youtube_link": "https://youtu.be/U74TQw8uUvk", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/U74TQw8uUvk"}, {"title": "5. Inconsistencies in \"official\" report", "subtitle": "5.10. History of Fires in steel-framed buildings", "commentary": "- No other steel-framed high rise building has ever collapsed due to fire. \n- Even WTC5 was on fire.  No sign of a collapse.", "youtube_link": "https://youtu.be/gz7L2tdUAgc", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/gz7L2tdUAgc"}, {"title": "5. Inconsistencies in \"official\" report", "subtitle": "5.10. History of Fires in steel-framed buildings", "commentary": "'- High-rise steel buildings don’t collapse from fires.", "youtube_link": "https://youtu.be/JRele5DMSoc", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/JRele5DMSoc"}, {"title": "5. Inconsistencies in \"official\" report", "subtitle": "5.10. History of Fires in steel-framed buildings", "commentary": "- More high-rise steel buildings that didn't collapse from longer more intense fires.", "youtube_link": "https://youtube.com/shorts/O0YL1VCTNaU?feature=share", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/O0YL1VCTNaU"}, {"title": "5. Inconsistencies in \"official\" report", "subtitle": "5.10. History of Fires in steel-framed buildings", "commentary": "- In Nov 2025, several steel-framed buildings burned intensely for over 24 hours.  NO COLLAPSE.\n- The buildings caught fire during extensive renovations.\n- Notice.  Not even the scaffolding collapsed due to the raging fires.\n- All these buildings are being refurbished today.\n- ONLY 3 STEEL BUILDINGS IN HISTORY HAVE EVER COLLAPSED DUE TO FIRES.  ALL 3 OCCURRED ON 9/11. None before; none after.", "youtube_link": "https://youtube.com/shorts/3WGWFB2rjvU?feature=share", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/3WGWFB2rjvU"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.1. Molten Steel", "commentary": "- NIST project leader says no evidence and no eyewitnesses of molten steel.\n- Jet fuel burns at 600 - 1400 degrees-F temperatures.\n- Structural steel melts at 2750 degrees-F.", "youtube_link": "https://youtu.be/KxT6fEZyRzw", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/KxT6fEZyRzw"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.2. Evaporated Steel", "commentary": "- Steel members partly evaporated, which happens at 4000-deg F.\n- Even FEMA reported partially evaporated steel.\n- \"…turning a solid steel girder turned to swiss cheese.\"", "youtube_link": "https://youtu.be/40NrzsMVx6Q", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/40NrzsMVx6Q"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.2. Evaporated Steel", "commentary": "- Jet fuel burns at 600 - 1400 degrees-F temperatures.\n- Structural steel melts at 2750 degrees-F.\n- Steel evaporates at 4500 degrees-F.", "youtube_link": "https://youtu.be/bQEtSTRjHyw", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/bQEtSTRjHyw"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.2. Evaporated Steel", "commentary": "- Steel burst into flames during excavation upon exposure to air/oxygen > 2500-degF", "youtube_link": "https://youtu.be/kouJazZRrDQ", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/kouJazZRrDQ"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.3. Extreme Temperatures under the rubble pile", "commentary": "- NASA Air Flights measured 1300-deg F on the surface of the rubble pile.\n- Eyewitness reported melted girders and flowing molten steel at WTC7.", "youtube_link": "https://youtu.be/Cb3eqmOBNmg", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/Cb3eqmOBNmg"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.3. Extreme Temperatures under the rubble pile", "commentary": "- \"Normal office fires cannot generate enough heat to melt iron or steel.\"", "youtube_link": "https://youtu.be/psIF9Jb4N20", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/psIF9Jb4N20"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.3. Extreme Temperatures under the rubble pile", "commentary": "- Molten metal is direct evidence for the use of thermite.\n- Thermite is a military-grade incendiary.  It burns at 4500 deg, enough to liquify steel.", "youtube_link": "https://youtu.be/7vn9QXzFTUw", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/7vn9QXzFTUw"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.3. Extreme Temperatures under the rubble pile", "commentary": "- Thermate = Thermite + sulphur.  Speeds up the reaction.", "youtube_link": "https://youtu.be/p12NvzItWZw", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/p12NvzItWZw"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.3. Extreme Temperatures under the rubble pile", "commentary": "- 1340 deg-F temp at WTC7 rubble pile persisted for 1 week.", "youtube_link": "https://youtu.be/08lxzqAb_60", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/08lxzqAb_60"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.3. Extreme Temperatures under the rubble pile", "commentary": "- The last fires were finally extinguished 3 months later.\n- Enormous quantities of water was used on the rubble pile.\n- \"As of 21 days after the attach, the fires were still burning and molten steel was still running.\" - Leslie Roberston, Structural Engineer.", "youtube_link": "https://youtu.be/hWyaXdrDWCw", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/hWyaXdrDWCw"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.4. Seismic Signal before collapse", "commentary": "Seismic detectors in Pougkeepsie NY picked up vibrations consistent with secondary explosions.   P-wave versus S-wave.", "youtube_link": null, "youtube_embed_url": null}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.5. Foreknowledge of Collapse (BBC)", "commentary": "- BBC reported WTC7 collapse 20 minute prior to event.", "youtube_link": "https://youtu.be/YZiN8oCObqE", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/YZiN8oCObqE"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.5. Foreknowledge of Collapse (BBC)", "commentary": "- CNN announced collapse of 50-story building @ 11am, 6 hours prior to the collapse of WTC7.", "youtube_link": "https://youtu.be/2ovf294yaqk", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/2ovf294yaqk"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.5. Foreknowledge of Collapse (BBC)", "commentary": "Stock market shorts for UA, ML, and other tenants.", "youtube_link": null, "youtube_embed_url": null}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.6. Secondary Explosions prior to planes hitting WTC1 & 2", "commentary": "- NIST did not look for evidence of explosives.\n- Eyewitness reports of explosives in WTC7.\n'- There are documented report from 100+ First Responders of secondary explosions in WTC7.", "youtube_link": "https://youtu.be/h05nTafa84s", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/h05nTafa84s"}, {"title": "6. Unaddressed Anomalies", "subtitle": "6.7. Destruction of Evidence", "commentary": "- Crucial Evidence Destroyed at record pace.  \n- 400 truck loads per day.", "youtube_link": "https://youtu.be/NoAA15UtDT0", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/NoAA15UtDT0"}, {"title": "7. The Clincher", "subtitle": "7.1.  Confession of Larry Silverstien", "commentary": "FEMA and NIST report that Firefighters were kept out of the building from early in the day.", "youtube_link": "https://youtu.be/joFUp1kJCzA", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/joFUp1kJCzA"}, {"title": "7. The Clincher", "subtitle": "7.1.  Confession of Larry Silverstien", "commentary": "- Billionaire Owner of WTC7 contradicts the official government (NIST) conclusion that thermal expansion brought down WTC7.  Who's right?\n-  PBS Interview w/ Charlie Rose (2002).  In Demolition industry parlance, \"Pull it\" is a controlled demolition; it refers to the moment the building is made to collapse.", "youtube_link": "https://youtu.be/VUh_taHqsr4", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/VUh_taHqsr4"}, {"title": "7. The Clincher", "subtitle": "7.1.  Confession of Larry Silverstien", "commentary": "- Controlled Demolition implies a planned event!!!", "youtube_link": "https://youtu.be/_Suyh5wzzwQ", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/_Suyh5wzzwQ"}, {"title": "8. For a Deeper Dive", "subtitle": "8.1. List of Sources", "commentary": "- 9/11: Explosive Evidence - Experts Speak Out (Free 1-hour version)  AE911Truth.org\nhttps://www.youtube.com/watch?v=Ddz2mw2vaEg&list=PLCFCB1EBC1BD3F5D9&index=2", "youtube_link": "https://www.youtube.com/watch?v=Ddz2mw2vaEg&list=PLCFCB1EBC1BD3F5D9&index=2", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/Ddz2mw2vaEg"}, {"title": "8. For a Deeper Dive", "subtitle": "8.1. List of Sources", "commentary": "- “An Objective Look at the Collapse of WTC 7” by Tony Szamboti\nhttps://www.youtube.com/watch?v=oFEMi617B6Q", "youtube_link": "https://www.youtube.com/watch?v=oFEMi617B6Q", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/oFEMi617B6Q"}, {"title": "8. For a Deeper Dive", "subtitle": "8.1. List of Sources", "commentary": "- 9/11: An Architect's Guide | Part 1: World Trade Center 7 (7/2/20 Webinar - R Gage)\nhttps://www.youtube.com/watch?v=KOj8pOlRDXc&list=PLUshF3H0xxH1txwn62QBDeK8lRD24df_a&index=3", "youtube_link": "https://www.youtube.com/watch?v=KOj8pOlRDXc&list=PLUshF3H0xxH1txwn62QBDeK8lRD24df_a&index=3", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/KOj8pOlRDXc"}, {"title": "8. For a Deeper Dive", "subtitle": "8.1. List of Sources", "commentary": "- Peak Prosperity w/ Chris Martinsen:  (31m).  WTC 7 Is the Smoking Gun\nhttps://www.youtube.com/watch?v=9y0hT4i1828", "youtube_link": "https://www.youtube.com/watch?v=9y0hT4i1828", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/9y0hT4i1828"}, {"title": "8. For a Deeper Dive", "subtitle": "8.1. List of Sources", "commentary": "- Dr. Hulsey Presentation to the UAF ASCE Student Chapter\nhttps://www.youtube.com/watch?v=bc5zF95o-UE", "youtube_link": "https://www.youtube.com/watch?v=bc5zF95o-UE", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/bc5zF95o-UE"}, {"title": "8. For a Deeper Dive", "subtitle": "8.1. List of Sources", "commentary": "- 9/11: Blueprint for Truth \nhttps://www.youtube.com/playlist?list=PL621A4B03C1169C78", "youtube_link": "https://www.youtube.com/playlist?list=PL621A4B03C1169C78", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/videoseries?list=PL621A4B03C1169C78"}, {"title": "8. For a Deeper Dive", "subtitle": "8.1. List of Sources", "commentary": "WTC 7 Did Not Collapse from Fire - Dr. Leroy Hulsey, UAF, Sept. 6, 2017\nhttps://www.youtube.com/watch?v=RYV33LKDY8k&list=PLUshF3H0xxH3iK_Zf5bo620W62ZeE_jxa&index=3", "youtube_link": "https://www.youtube.com/watch?v=RYV33LKDY8k&list=PLUshF3H0xxH3iK_Zf5bo620W62ZeE_jxa&index=3", "youtube_embed_url": "https://www.youtube-nocookie.com/embed/RYV33LKDY8k"}];

  // Group items by Title, then by Subtitle, preserving spreadsheet order.
  const sections = [];
  const sectionIndex = new Map();
  ITEMS.forEach((item, i) => {
    item._id = i;
    const titleKey = item.title || "Untitled";
    if (!sectionIndex.has(titleKey)) {
      sectionIndex.set(titleKey, { title: titleKey, subtitleIndex: new Map(), subtitles: [] });
      sections.push(sectionIndex.get(titleKey));
    }
    const section = sectionIndex.get(titleKey);
    const subKey = item.subtitle || "(untitled topic)";
    if (!section.subtitleIndex.has(subKey)) {
      section.subtitleIndex.set(subKey, { subtitle: subKey, items: [] });
      section.subtitles.push(section.subtitleIndex.get(subKey));
    }
    section.subtitleIndex.get(subKey).items.push(item);
  });

  const navRoot = document.getElementById('navRoot');
  const crumbTitle = document.getElementById('crumbTitle');
  const subtitleHeading = document.getElementById('subtitleHeading');
  const clipsRoot = document.getElementById('clipsRoot');

  function renderCommentaryHTML(text){
    const lines = (text || '').split('\n').filter(l => l.trim().length > 0);
    if (!lines.length){
      return '<p>No commentary provided for this segment.</p>';
    }
    return lines.map(l => `<p>${l.trim().replace(/&/g,'&amp;').replace(/</g,'&lt;')}</p>`).join('');
  }

  function selectSubtitle(sectionTitle, subKey){
    document.querySelectorAll('.subtitle-item').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-section') === sectionTitle && el.getAttribute('data-sub') === subKey);
    });

    const section = sectionIndex.get(sectionTitle);
    const sub = section.subtitleIndex.get(subKey);

    crumbTitle.textContent = sectionTitle;
    subtitleHeading.textContent = subKey === "(untitled topic)" ? "" : subKey;

    clipsRoot.innerHTML = '';
    sub.items.forEach((item, idx) => {
      const clip = document.createElement('div');
      clip.className = 'clip';

      const hasVideo = !!item.youtube_embed_url;

      const mediaHTML = hasVideo
        ? `<iframe
             src="${item.youtube_embed_url}"
             title="${(subKey || sectionTitle).replace(/"/g,'&quot;')}"
             frameborder="0"
             allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
             referrerpolicy="strict-origin-when-cross-origin"
             allowfullscreen></iframe>`
        : `<div class="video-placeholder">
             <span class="icon">&#9633;</span>
             <p>This video hasn't been uploaded to YouTube yet.</p>
           </div>`;

      clip.innerHTML = `
        ${sub.items.length > 1 ? `<p class="clip-index">Clip ${idx + 1} of ${sub.items.length}</p>` : ''}
        <div class="commentary">
          <h3>Commentary</h3>
          <div class="commentary-text">${renderCommentaryHTML(item.commentary)}</div>
        </div>
        <div class="video-frame${hasVideo ? '' : ' unavailable'}">
          ${mediaHTML}
        </div>
      `;

      clipsRoot.appendChild(clip);
    });
  }

  sections.forEach((section, sIdx) => {
    const group = document.createElement('div');
    group.className = 'section-group' + (sIdx === 0 ? '' : ' collapsed');

    const toggle = document.createElement('button');
    toggle.className = 'section-toggle';
    toggle.type = 'button';
    toggle.innerHTML = `<span>${section.title}</span><span class="chevron">&#9660;</span>`;
    toggle.addEventListener('click', () => group.classList.toggle('collapsed'));
    group.appendChild(toggle);

    const body = document.createElement('div');
    body.className = 'section-body';

    const list = document.createElement('ul');
    list.className = 'subtitle-list';
    section.subtitles.forEach(sub => {
      const li = document.createElement('li');
      li.className = 'subtitle-item';
      li.setAttribute('data-section', section.title);
      li.setAttribute('data-sub', sub.subtitle);
      const countBadge = sub.items.length > 1 ? ` <span class="clip-count">(${sub.items.length})</span>` : '';
      li.innerHTML = `<button class="subtitle-btn" type="button">${sub.subtitle === "(untitled topic)" ? section.title : sub.subtitle}${countBadge}</button>`;
      li.querySelector('button').addEventListener('click', () => selectSubtitle(section.title, sub.subtitle));
      list.appendChild(li);
    });
    body.appendChild(list);

    group.appendChild(body);
    navRoot.appendChild(group);
  });

  if (sections.length){
    selectSubtitle(sections[0].title, sections[0].subtitles[0].subtitle);
  }
</script>
